spring:
  application:
    name: aipractice

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000

  flyway:
    enabled: true
    # 기존 실습 DB에는 Spring AI가 만든 vector_store가 이미 있을 수 있다.
    # baseline을 0으로 잡아 기존 테이블은 보존하고 V1부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 0

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        options:
          model: gpt-4o-mini

      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: vector_store

    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

    tools:
      throw-exception-on-error: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        rag.ingestion.duration: true
        rag.search.duration: true
        rag.llm.duration: true

rag:
  embedding-model: text-embedding-3-small
