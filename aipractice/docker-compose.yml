services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: aipractice-pgvector
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data

volumes:
  rag_pg_data: